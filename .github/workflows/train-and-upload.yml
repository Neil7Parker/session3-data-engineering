name: Train and Upload to Hugging Face

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imdb-train-and-upload
  cancel-in-progress: false

jobs:
  train-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_REPO_ID: ${{ vars.HF_REPO_ID || 'Li7HaoRan/imdb-sentiment-mlp' }}
      DATA_FILE: ${{ vars.DATA_FILE }}
      TEXT_COLUMN: ${{ vars.TEXT_COLUMN }}
      LABEL_COLUMN: ${{ vars.LABEL_COLUMN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate deployment configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('HF_TOKEN') or os.environ.get('HF_REPO_ID', '').count('/') != 1:
              raise SystemExit('Set HF_TOKEN in Actions secrets and HF_REPO_ID in Actions variables.')
          PY
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Train and evaluate
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          command = [sys.executable, 'train.py']
          for variable, flag in [('DATA_FILE', '--data'), ('TEXT_COLUMN', '--text-column'), ('LABEL_COLUMN', '--label-column')]:
              if os.environ.get(variable):
                  command += [flag, os.environ[variable]]
          subprocess.run(command, check=True)
          PY
      - name: Verify artifact reload and inference
        run: |
          python - <<'PY'
          import json
          import pickle
          import subprocess
          import sys
          from pathlib import Path
          with Path('model/vectorizer.pkl').open('rb') as handle:
              vectorizer = pickle.load(handle)
          vocabulary_example = ' '.join(vectorizer.get_feature_names_out()[:50])
          subprocess.run([sys.executable, 'predict.py', vocabulary_example], check=True)
          metrics = json.loads(Path('model/metrics.json').read_text())
          print('Held-out test accuracy:', metrics['test_accuracy'])
          print('Held-out test macro-F1:', metrics['test_macro_f1'])
          PY
      - name: Publish model bundle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy.py
