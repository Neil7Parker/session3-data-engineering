name: Run Pickle Course Examples
on:
  push:
    branches: [main, master]
    paths:
      - 'pickle-practice/**'
      - '.github/workflows/pickle-examples.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pickle-practice
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pickle-practice/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python run_examples.py
      - run: python load_saved.py
      - uses: actions/upload-artifact@v7
        with:
          name: Pickle-Practice-Outputs
          path: |
            pickle-practice/*.pkl
            pickle-practice/*.joblib
            pickle-practice/*.png
            pickle-practice/verification.json
          if-no-files-found: error
